<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="Imagenes/logo.jpg">

<title>Pago | Midnight Café</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="estilos.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark custom-navbar">

<div class="container">


    <a class="navbar-brand d-flex align-items-center" href="index.html">

    <img
    src="Imagenes/logo.jpg"
    alt="Logo Midnight Café"
    class="logo-navbar">

    <span class="ms-2">
        Midnight Café
    </span>

    </a>

</div>

</nav>

<div class="container py-5">

<div class="row">

<!-- FORMULARIO -->

<div class="col-lg-8">

<div class="payment-card">

<h2>

<i class="bi bi-credit-card-fill"></i>

Método de Pago

</h2>

<hr>

<form>

<div class="mb-3">

<label class="form-label">

Nombre del Titular

</label>

<input
type="text"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">

Número de Tarjeta

</label>

<input
type="text"
class="form-control"
maxlength="16"
required>

</div>

<div class="row">

<div class="col-md-6">

<label class="form-label">

Fecha de Expiración

</label>

<input
type="month"
class="form-control"
required>

</div>

<div class="col-md-6">

<label class="form-label">

CVV

</label>

<input
type="password"
class="form-control"
maxlength="4"
required>

</div>

</div>

<hr>

<h4 class="mt-4">

O pagar con

</h4>

<div class="d-grid gap-2">

<button
type="button"
class="btn btn-primary">

<i class="bi bi-paypal"></i>

PayPal

</button>

<button
type="button"
class="btn btn-dark">

<i class="bi bi-google"></i>

Google Pay

</button>

</div>

<hr>

<button
type="button"
class="btn btn-success w-100 mt-3"
onclick="confirmarCompra()">

Finalizar Compra

</button>

</form>

</div>

</div>

<!-- RESUMEN -->

<div class="col-lg-4">

<div class="cart-total">

<h4>

Resumen del Pedido

</h4>

<hr>

<p>

Subtotal:
<strong id="subtotal">
$0.00
</strong>

</p>

<p>

IVA:
<strong id="iva">
$0.00
</strong>

</p>

<hr>

<p>

Total:
<strong id="total">
$0.00
</strong>

</p>

<div class="alert alert-info mt-3">

<i class="bi bi-info-circle-fill"></i>

Pago 100% seguro.

</div>

</div>

</div>

</div>

</div>

<script src="app.js"></script>

<script>

document.addEventListener(
"DOMContentLoaded",
function(){

let carrito =
JSON.parse(
localStorage.getItem("carrito")
) || [];

let subtotal = 0;

carrito.forEach(item=>{

subtotal += item.precio;

});

const iva =
subtotal * 0.15;

const total =
subtotal + iva;

document.getElementById(
"subtotal"
).textContent =
"$" + subtotal.toFixed(2);

document.getElementById(
"iva"
).textContent =
"$" + iva.toFixed(2);

document.getElementById(
"total"
).textContent =
"$" + total.toFixed(2);

});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
